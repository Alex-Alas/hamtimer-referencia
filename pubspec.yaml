name: hamtimer
description: "Hamtimer: tareas, Pomodoro, puntos, filtros con ML Kit y feed de fotos. Proyecto final de Desarrollo de Aplicaciones Móviles (ESEN)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado (clase 14)
  provider: ^6.1.5+1

  # API REST con Dio (clases 20-22)
  dio: ^5.11.1

  # Persistencia local (clases 25-26)
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  path: ^1.9.1

  # Firebase (clases 23 y 29)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_analytics: ^13.0.1
  firebase_messaging: ^17.0.1

  # Cámara en vivo y ML Kit (clases 24 y 29)
  camera: ^0.12.2
  google_mlkit_face_detection: ^0.15.1

  intl: ^0.20.3
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
